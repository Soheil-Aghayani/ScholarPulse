<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ScholarPulse app icon</title>
  <desc id="desc">A glassy blue and violet research book with a rising citation line.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="890" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39a6ff"/>
      <stop offset="0.42" stop-color="#4f72f3"/>
      <stop offset="0.78" stop-color="#7655df"/>
      <stop offset="1" stop-color="#c16be7"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(235 176) rotate(46) scale(470)">
      <stop offset="0" stop-color="#b8f3ff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#b8f3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(815 846) rotate(-135) scale(480)">
      <stop offset="0" stop-color="#f7c9ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f7c9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="190" y1="130" x2="840" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="page" x1="260" y1="420" x2="758" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9f2ff"/>
      <stop offset="1" stop-color="#cdd9ff"/>
    </linearGradient>
    <linearGradient id="ink" x1="280" y1="420" x2="760" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173fbc"/>
      <stop offset="0.55" stop-color="#284ec9"/>
      <stop offset="1" stop-color="#6332b7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#17205d" flood-opacity="0.3"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#111b5e" flood-opacity="0.26"/>
    </filter>
