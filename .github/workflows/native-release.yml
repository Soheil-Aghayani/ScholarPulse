name: Build ScholarPulse native releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: scholarpulse-native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows bundle
        uses: tauri-apps/tauri-action@v1
        with:
          tagName: v__VERSION__
          releaseName: ScholarPulse v__VERSION__
          releaseBody: |
            ScholarPulse native release.

            - Windows: install the NSIS `.exe` or MSI package.
            - Android: install the APK; the AAB is ready for a future store pipeline.
            - The hosted web app remains available at https://scholarpulse-hfew.onrender.com/.
          releaseDraft: false
          prerelease: false

  android:
    name: Android APK and AAB
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run tauri -- android init

      - name: Configure Android system-bar insets
        run: python scripts/patch_android_insets.py src-tauri/gen/android

      - name: Configure Android release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: python scripts/configure_android_signing.py src-tauri/gen/android

      - name: Build APK
        run: npm run tauri -- android build --apk

      - name: Build AAB
        run: npm run tauri -- android build --aab

      - name: Verify and name Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android -type f -path '*/outputs/apk/*release/*.apk' ! -name '*unsigned*' | sort | head -n 1)
          aab=$(find src-tauri/gen/android -type f -path '*/outputs/bundle/*release/*.aab' | sort | head -n 1)
          test -n "$apk"
          test -n "$aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          jarsigner -verify "$aab" >/dev/null
          cp "$apk" ScholarPulse-Android.apk
          cp "$aab" ScholarPulse-Android.aab

      - name: Upload Android artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "v${GITHUB_REF_NAME#v}" ScholarPulse-Android.apk ScholarPulse-Android.aab --clobber
